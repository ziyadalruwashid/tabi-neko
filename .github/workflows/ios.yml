# Builds the iPhone/iPad app on GitHub's Macs and uploads it to TestFlight,
# so it installs from Apple's TestFlight app without anyone owning a Mac.
# Run it from the Actions tab ("Run workflow"), or it runs by itself when the
# app or the site changes on main (not for new places alone, like Android).
#
# It needs four repository secrets (Settings → Secrets and variables →
# Actions). Until all four are set it skips itself with a note, so merges
# don't go red:
#   APPLE_TEAM_ID       the 10-character Team ID (developer.apple.com → Membership)
#   APPSTORE_KEY_ID     an App Store Connect API key's Key ID
#   APPSTORE_ISSUER_ID  the Issuer ID shown above the list of keys
#   APPSTORE_KEY_P8     the whole text of that key's .p8 file
# The key needs the Admin role: each build makes its own Apple Distribution
# certificate and App Store profile through the API, signs with them and
# deletes them again (.github/scripts/asc_signing.py), so nothing is stored
# here and no iPhone has to be registered on the account.
# Each build's number is the run number, so every upload is newer than the last.
name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - index.html
      - css/**
      - js/**
      - data/**
      - '!data/places.js'
      - '!data/hoods.js'
      - '!data/trips.js'
      - '!data/ar/content.js'
      - '!data/scout.json'
      - assets/**
      - .github/workflows/ios.yml

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check the Apple secrets
        id: keys
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.APPSTORE_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISS" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing APPSTORE_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::notice::iOS build skipped: these secrets aren't set yet:$missing"
            echo "iOS build skipped: missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Copy the site into the app
        if: steps.keys.outputs.ready == 'true'
        working-directory: app
        run: npm ci && npm run web && npx cap sync ios
      - name: Read the App Store Connect key
        id: key
        if: steps.keys.outputs.ready == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.APPSTORE_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          # Trim stray spaces around the IDs, then rebuild the .p8 as a clean
          # PEM whatever shape it was pasted in (Windows line endings, one
          # long line, no BEGIN/END lines, or the whole file base64-encoded).
          TEAM="$(printf '%s' "$TEAM" | tr -d '[:space:]')"
          KID="$(printf '%s' "$KID" | tr -d '[:space:]')"
          ISS="$(printf '%s' "$ISS" | tr -d '[:space:]')"
          KEY="$RUNNER_TEMP/AuthKey_$KID.p8"
          python3 - "$KEY" <<'PY'
          import base64, os, re, sys
          raw = os.environ["P8"].replace("\r", "").strip()
          if "BEGIN" not in raw:
              try:
                  dec = base64.b64decode(re.sub(r"\s", "", raw), validate=True).decode()
                  if "BEGIN" in dec:
                      raw = dec
              except Exception:
                  pass
          body = re.sub(r"-----[A-Z ]+-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          with open(sys.argv[1], "w") as f:
              f.write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          PY
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::APPSTORE_KEY_P8 isn't a readable App Store Connect key. Open the downloaded AuthKey_….p8 in a plain text editor, copy all of it (from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----) and paste it into the secret again."
            exit 1
          fi
          echo "API key read OK (Key ID ${#KID} characters, Team ID ${#TEAM} characters)."
          { echo "path=$KEY"; echo "kid=$KID"; echo "iss=$ISS"; echo "team=$TEAM"; } >> "$GITHUB_OUTPUT"
      # Manual App Store signing: no registered iPhones needed (see the script).
      - name: Make an App Store certificate and profile for this build
        id: sign
        if: steps.keys.outputs.ready == 'true'
        env:
          KEY: ${{ steps.key.outputs.path }}
          KID: ${{ steps.key.outputs.kid }}
          ISS: ${{ steps.key.outputs.iss }}
          TEAM: ${{ steps.key.outputs.team }}
          BUNDLE: com.ziyadalruwashid.tabineko
          PROJECT: app/ios/App/App.xcodeproj/project.pbxproj
          WORK: ${{ runner.temp }}
        run: python3 .github/scripts/asc_signing.py setup
      - name: Build, sign and upload to TestFlight
        if: steps.keys.outputs.ready == 'true'
        working-directory: app/ios/App
        env:
          KEY: ${{ steps.key.outputs.path }}
          KID: ${{ steps.key.outputs.kid }}
          ISS: ${{ steps.key.outputs.iss }}
          TEAM: ${{ steps.key.outputs.team }}
          PROFILE: ${{ steps.sign.outputs.profile_name }}
          BUNDLE: com.ziyadalruwashid.tabineko
          BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD" | tail -n 150
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PROFILE</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" | tail -n 80
          VER=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/App.xcarchive/Info.plist")
          echo "Uploaded Tabi Neko $VER ($BUILD) to TestFlight. Apple takes about 10–30 minutes to process it before it shows in the TestFlight app." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove this build's certificate, profile and key
        if: always() && steps.keys.outputs.ready == 'true'
        env:
          KEY: ${{ steps.key.outputs.path }}
          KID: ${{ steps.key.outputs.kid }}
          ISS: ${{ steps.key.outputs.iss }}
          CERT_ID: ${{ steps.sign.outputs.cert_id }}
          PROFILE_ID: ${{ steps.sign.outputs.profile_id }}
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
        run: |
          if [ -n "$KEY" ] && [ -f "$KEY" ]; then python3 .github/scripts/asc_signing.py cleanup; fi
          rm -f "$KEY"
